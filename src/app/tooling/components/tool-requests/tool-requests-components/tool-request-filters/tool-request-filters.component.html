<!-- TODO ajouter un bouton pour annuler tous les filtres -->
<ion-header>

  <ion-toolbar>
    <ion-title>
      <ion-icon slot="start" name="filter-outline"></ion-icon>
      Filtres
    </ion-title>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <!-- TODO utiliser justify="space-between" plutôt que le scss -->
  <ion-list>
    @for (filterItem of toolRequestFilters(); track $index) {
    <ion-item class="filter-item ion-margin" lines="none">
      <ion-select color="medium" #filter cancel-text="annuler" ok-text="appliquer" fill="outline" [label]="filterItem.name"
        class="filter" multiple="true" [placeholder]="'Filtre ' + filterItem.name"
      (ionChange)="filterChange(filterItem,$event)">
        @for(filter of filterItem.options; track filter){
        
        <ion-select-option [value]="filter">{{filter}}</ion-select-option>
        }
        </ion-select>
        </ion-item>
        }
        </ion-list>
</ion-content>

<ion-footer>

  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="solid" slot=end color="primary" slot=end (click)="resetFiltersClick()">
        Supprimer les filtres
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
