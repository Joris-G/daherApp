<form [formGroup]="identityForm()">
  <app-card [titles]="{title:'Identité'}">
    <ion-grid fixed class="ion-align-items-center ion-justify-content-center">
        <ion-row>
          <ion-col size="12">
            <ion-label>Identité</ion-label>
          </ion-col>
        </ion-row>
        <ion-row>
          <!-- **************************** -->
          <!-- *********    NOM    ******** -->
          <!-- **************************** -->
          <ion-col size="6">
            <ion-item>
              <ion-label color=primary position="floating">Nom
                <ion-text color="danger">*</ion-text>
              </ion-label>
              <ion-input formControlName="lastName" type="text"></ion-input>
            </ion-item>
          </ion-col>
          <!-- **************************** -->
          <!-- *******    PRENOM   ******** -->
          <!-- **************************** -->
          <ion-col size="6">
            <ion-item>
              <ion-label color=primary position="floating">Prénom
                <ion-text color="danger">*</ion-text>
              </ion-label>
              <ion-input formControlName="firstName" type="text"></ion-input>
            </ion-item>
          </ion-col>
        </ion-row>
        <ion-row>
          <!-- **************************** -->
          <!-- *****   MOT DE PASSE   ***** -->
          <!-- **************************** -->
          <ion-col size="12">
            <!-- TODO Voir avec le state pour savoir si l'utilisateur créé est un utilisateur sans mot de passe -->
            <!-- <ion-item *ngIf="identityForm().controls.poste.value !==4"> -->
            <ion-item>
              <ion-label color=primary position="floating">Mot de passe
                <ion-text color="danger">*</ion-text>
              </ion-label>
              <ion-input type="password" formControlName="password"
                pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)^[a-zA-Z\d]{6,12}$"></ion-input>
              <ion-note slot="helper">Le mot de passe doit faire entre 6 et 12 caractères. Il doit au moins contenir une
                majuscule, une minuscule et un chiffre</ion-note>
            </ion-item>
            <!-- **************************** -->
            <!-- ****  CTRL MOT DE PASSE  *** -->
            <!-- **************************** -->
            <!-- TODO Voir avec le state pour savoir si l'utilisateur créé est un utilisateur sans mot de passe -->
            <!-- <ion-item *ngIf="identityForm().controls.poste.value !==4"> -->
            <ion-item>
              <ion-label color=primary position="floating">Répéter mot de passe
                <ion-text color="danger">*</ion-text>
              </ion-label>
              <ion-input formControlName="confirmPassword" type="password"></ion-input>
            </ion-item>
          </ion-col>
        </ion-row>
        <ion-row>
          <!-- **************************** -->
          <!-- ******   MATRICULE   ******* -->
          <!-- **************************** -->
          <ion-col size="6">
            <ion-item>
              <ion-label color=primary position="floating">Matricule
                <ion-text color="danger">*</ion-text>
              </ion-label>
              <ion-input formControlName="matricule" type="text"></ion-input>
            </ion-item>
          </ion-col>
          <!-- **************************** -->
          <!-- ******   TELEPHONE   ******* -->
          <!-- **************************** -->
          <ion-col size="6">
            <ion-item>
              <ion-label color=primary position="floating">Téléphone
                <!-- <ion-text color="danger">*</ion-text> -->
              </ion-label>
              <ion-input formControlName="telephone" type="text"></ion-input>
            </ion-item>
          </ion-col>
        </ion-row>
      </ion-grid>
  </app-card>
</form>
