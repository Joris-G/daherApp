  <p-floatlabel variant="on">
    <p-datepicker inputId="date_de_besoin" showIcon iconDisplay="input" formControlName="dateBesoin"
      dateFormat="dd-mm-yy" />
    <label for="date_de_besoin">Date de besoin<span color="danger"> *</span></label>
    @if (specSboForm().controls.dateBesoin.hasError('')) {
    @if (specSboForm().controls.dateBesoin.hasError('required')) {
    <p-message severity="error" size="small" variant="simple">Champ obligatoire</p-message>
    }
    }
  </p-floatlabel>
  
  <p-floatlabel variant="on">
    <input pInputText id="title" autocomplete="off" formControlName="title"
      placeholder="indiquer un titre bref de la demande" />
    <label for="title">Titre de la demande<span color="danger"> *</span></label>
  </p-floatlabel>
  
  <div class="flex-auto">
    <label class="mb-2 font-bold block" for="description">Description<span severity="danger"> *</span></label>
    <p-editor inputId="description" formControlName="description" [invalid]="specSboForm().get('description').invalid"
      [style]="{ height: '320px' }" />
    @if (specSboForm().get('description').invalid) {
    <p-message severity="error" size="small" variant="simple">Content is required.</p-message>
    }
  
  </div>
