<div class="flex flex-column h-full surface-section">
  <p-toolbar class="bg-gray-900 border-none p-2" [style]="{'border-radius': '0'}">
    <div class="p-toolbar-group-start">
      <i class="pi pi-filter mr-2 text-white"></i>
      <h3 class="text-white m-0 font-medium">Filtres</h3>
    </div>
    <div class="p-toolbar-group-end">
      <p-button icon="pi pi-filter-slash" [text]="true" severity="secondary" (onClick)="resetFiltersClick()"
        pTooltip="Réinitialiser" styleClass="text-white">
      </p-button>
    </div>
  </p-toolbar>

  <div class="flex-grow-1 overflow-y-auto p-3">
    <div class="flex flex-column gap-4">
      @for (filterItem of toolRequestFilters(); track filterItem.name) {
      <div class="flex flex-column gap-2">
        <label [for]="filterItem.name" class="font-bold text-700 ml-1">{{ filterItem.name }}</label>
        <p-multiSelect [id]="filterItem.name" [options]="filterItem.options"
          [placeholder]="'Choisir ' + filterItem.name" [display]="'chip'" class="w-full"
          (onChange)="filterChange(filterItem, $event)">
        </p-multiSelect>
      </div>
      }
    </div>
  </div>

  <footer class="p-3 border-top-1 surface-border">
    <p-button label="Supprimer les filtres" icon="pi pi-trash" severity="danger" [outlined]="true" styleClass="w-full"
      (onClick)="resetFiltersClick()">
    </p-button>
  </footer>
</div>
