@let tool = value();
<ion-item>
  <!-- <ion-label *ngIf="tool"> {{(tool.sapToolNumber.length > 5) ? ' OT' : ' OT0'}}</ion-label> -->
  <ion-input label="Outillage SAP : " toolInput placeholder="n°OT SAP ou n° Equipement SAP" />
  @if(tool){
  <ion-icon slot="end" name="close-outline" color=danger></ion-icon>
  }@else {
  <ion-icon slot="end" name="checkmark" color=success></ion-icon>
  }
</ion-item>
@if(tool){
<ion-item>
  <ion-input label="Désignation outillage" type="text" disabled="true" [value]="tool.designation"></ion-input>
  </ion-item>
  <ion-item>
  <ion-input label="Programme avion" type="text" disabled="true" [value]="tool.programme.designation"></ion-input>
  </ion-item>
}
